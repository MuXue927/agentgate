[project]
name = "agentgate"
version = "0.2.0"
description = "Unattended Codex execution and read-only verification loop"
authors = [
    { name = "MuXue927", email = "231446316+MuXue927@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0,<7",
    "typer>=0.16,<1",
]

[project.scripts]
ag = "agentgate.cli:app"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

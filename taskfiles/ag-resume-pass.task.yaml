id: ag-resume-pass
repo: D:/Projects/<your-repo>
goal: |
  In the repository root, create final-number.txt containing the first prime number.
  Do not modify any other file.
executor: {harness: codex, model: deepseek-v4-flash}
verifier: {harness: codex, model: nvidia/nemotron-3.5-lightning:free}
constraints:
  - Do not modify files other than final-number.txt.
  - Do not push or merge.
checks:
  - name: final-number-matches
    run: type final-number.txt
    expect: {exit: 0, stdout_contains: "3"}
budget: {max_rounds: 2, max_minutes_per_round: 5, max_total_minutes: 10}
human_approval: {before_execute: false, before_merge: true}
